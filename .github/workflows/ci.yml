name: CI/CD

on:
  push:
    branches:
      - master

jobs:
  aws_architecture:
    name: AWS cloud architecture
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    defaults:
      run:
        working-directory: terraform/
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false
      - name: Terraform format
        id: fmt
        run: terraform fmt -check
      - name: Terraform init
        run: terraform init
      - name: Terraform plan
        run: terraform plan -var="db_pass=${{ secrets.DB_PASS }}"
      - name: Terraform apply
        run: terraform apply -auto-approve -var="db_pass=${{ secrets.DB_PASS }}"
      - name: Terraform outputs
        run: terraform output -json > tf_outputs.json
      - name: Upload Terraform outputs
        uses: actions/upload-artifact@v4
        with:
          name: tf-outputs
          # TODO: isn't there a better method than showing the absolute path
          path: /home/runner/work/Notes/Notes/terraform/tf_outputs.json

  test:
    name: Run tests
    runs-on: ubuntu-latest
    env:
      REDIS_URL: ${{ secrets.REDIS_URL_PYTEST }}
      DATABASE_URL: ${{ secrets.DATABASE_URL_PYTEST }}
      SECRET_KEY: ${{ secrets.SECRET_KEY_PYTEST }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.14.4"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytests
        run: pytest

  build:
    name: Build Docker images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6
      - name: Build notes-app Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/notes-app:latest .
      - name: Build nginx Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/nginx:latest nginx/
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/notes-app:latest
      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/nginx:latest

  deploy:
    name: Deploy to EC2
    needs: [build, aws_architecture]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6
      - name: Download Terraform outputs
        uses: actions/download-artifact@v4
        with:
          name: tf-outputs
      - name: Extract Terraform outputs
        run: |
          echo "EC2_HOST=$(jq -r '.instance_ip_addr.value' tf_outputs.json)" >> $GITHUB_ENV
          echo "DATABASE_URL=$(jq -r '.db_instance_addr.value' tf_outputs.json)" >> $GITHUB_ENV
      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml, docker-compose.prod.yml"
          target: "~/"
      - name: Set up docker and docker-compose on EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo apt update
            sudo apt install docker.io -y

            sudo usermod -aG docker $USER

            # Install Docker Compose v2
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose

      - name: Create .env file
        run: |
          echo "DATABASE_URL=postgresql+psycopg://${{ secrets.DB_USER }}:${{ secrets.DB_PASS }}@$DATABASE_URL:5432/notes_db" >> .env
          echo "SECRET_KEY="${{ secrets.SECRET_KEY }}"" >> .env
          echo "REDIS_URL=redis://redis:6379" >> .env
      - name: Copy .env file to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".env"
          target: "~/"
      - name: Deploy docker images to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull conraaddocker/notes-app:latest
            docker pull conraaddocker/nginx:latest

            docker-compose -f docker-compose.yml -f docker-compose.prod.yml down
            docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            # clean up configuration files
            rm .env docker-compose.yml docker-compose.prod.yml
