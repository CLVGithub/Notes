name: CI

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    env:
      REDIS_URL: ${{ secrets.REDIS_URL_PYTEST }}
      DATABASE_URL: ${{ secrets.DATABASE_URL_PYTEST }}
      SECRET_KEY: ${{ secrets.SECRET_KEY_PYTEST }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.14.4"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytests
        run: pytest
      - name: Build Docker image
        run: docker build -t github-cd .
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Tag image
        run: docker tag github-cd ${{ secrets.DOCKER_USERNAME }}/github-cd:latest
      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/github-cd:latest

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull conraaddocker/github-cd:latest

            docker stop fastapi-container || true
            docker rm fastapi-container || true

            docker run -d \
              --restart always \
              -p 8000:8000 \
              -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
              -e REDIS_URL=${{ secrets.REDIS_URL }} \
              -e SECRET_KEY=${{ secrets.SECRET_KEY }} \
              --name fastapi-container \
              conraaddocker/github-cd:latest

            # TODO: set up nginx as well.  Most probably going to use docker-compose to set up nginx in a container alongside the fast-api container
